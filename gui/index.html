<!doctype html>
<meta charset="utf-8">
<title>电子书转换 · 电子墨水屏排版</title>
<style>
  :root{--bg:#faf9f7;--fg:#1a1a1a;--mut:#7a7a7a;--faint:#a0a0a0;--line:#e0dcd7;
        --acc:#2b6cb0;--ok:#2f7a3d;--bad:#b03030;--warn:#8a6100}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
  h1{font-size:15px;margin:0;font-weight:600}
  .sub{color:var(--faint);font-size:12px}
  main{display:grid;grid-template-columns:296px 1fr;height:calc(100vh - 49px)}
  aside{padding:16px 18px 28px;border-right:1px solid var(--line);overflow-y:auto}
  section{padding:14px 20px 18px;display:flex;flex-direction:column;min-width:0}

  .drop{border:1.5px dashed var(--line);border-radius:8px;padding:20px 14px;text-align:center;
        color:var(--mut);cursor:pointer;background:#fff;font-size:13px}
  .drop.on{border-color:var(--acc);background:#eef4fb;color:var(--acc)}
  .fname{font-size:12px;margin-top:7px;color:var(--fg);word-break:break-all}

  label{display:block;font-size:12px;color:var(--mut);margin:15px 0 4px}
  select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;
         background:#fff;font:inherit;font-size:13px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  /* 派生数值：紧贴产生它的控件，作为辅助说明，而非独立面板 */
  .hint{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.5}
  .hint .v{color:var(--mut)}
  .ok{color:var(--ok)} .warn{color:var(--bad)}

  button{width:100%;padding:9px;border:0;border-radius:6px;background:var(--acc);color:#fff;
         font:inherit;font-weight:500;cursor:pointer;margin-top:16px}
  button:disabled{opacity:.35;cursor:default}
  button.sec{background:#fff;color:var(--fg);border:1px solid var(--line);margin-top:8px;font-weight:400}

  .st{font-size:12px;padding:7px 10px;border-radius:5px;margin-top:12px;display:none}
  .st.show{display:block}
  .st.ok{background:#e6f2e8;color:var(--ok)} .st.err{background:#fbeaea;color:var(--bad)}
  .st.run{background:#fdf3e0;color:var(--warn)} .st.info{background:#eef2f7;color:var(--mut)}

  .pbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--mut)}
  .pbar button{width:auto;margin:0;padding:4px 10px;font-size:12px}
  .pbar input{width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font:inherit}
  .stage{flex:1;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
         background:#efedea;border:1px solid var(--line);border-radius:6px;padding:18px}
  .page{background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.13)}
  .page img{display:block;width:100%;height:auto}
  .empty{padding:56px 24px;text-align:center;color:var(--faint);font-size:12px;line-height:1.9}
  /* 技术参数：降级到页脚，不占主区 */
  .tech{margin-top:10px;font-size:11px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap}
  .tech b{font-weight:500;color:var(--mut)}
  .badge{font-size:10px;padding:1px 5px;border-radius:3px;background:#eee;color:var(--mut)}
  .badge.v{background:#e6f2e8;color:var(--ok)} .badge.u{background:#fbeaea;color:var(--bad)}
</style>

<header>
  <h1>电子书转换</h1>
  <span class="sub">EPUB → 按屏幕原生尺寸排版的 PDF</span>
</header>

<main>
<aside>
  <div class="drop" id="drop">拖入电子书<br><span style="font-size:11px">或点击选择（EPUB / FB2 / HTML）</span></div>
  <input type="file" id="file" accept=".epub,.fb2,.html,.md" hidden>
  <div class="fname" id="fname"></div>

  <label>目标设备</label>
  <select id="dev"></select>
  <div class="hint" id="devhint"></div>

  <label>中文字体</label>
  <select id="cjk"></select>
  <label>西文字体</label>
  <select id="latin"></select>

  <label>正文字号</label>
  <select id="size"></select>
  <div class="hint" id="sizehint"></div>

  <div class="row">
    <div><label>页边距</label><select id="margin"></select></div>
    <div><label>行距</label><select id="leading"></select></div>
  </div>
  <div class="hint" id="marginhint"></div>

  <label>语言</label>
  <select id="lang"><option value="zh">中文</option><option value="en">English</option></select>

  <button id="go" disabled>转换</button>
  <button id="save" class="sec" disabled>另存 PDF…</button>

  <div class="st" id="st"></div>
</aside>

<section>
  <div class="pbar">
    <button class="sec" id="prev" disabled>←</button>
    <span>第</span><input type="number" id="pg" value="1" min="1" disabled>
    <span id="pgtot">页</span>
    <button class="sec" id="next" disabled>→</button>
    <span style="flex:1"></span>
    <span id="pnote"></span>
  </div>

  <div class="stage">
    <div class="page" id="page" style="width:360px">
      <div class="empty">转换后在此显示预览<br>按页面真实宽高比呈现</div>
    </div>
  </div>

  <div class="tech" id="tech"></div>
</section>
</main>

<script>
const $ = s => document.querySelector(s);
let DEV=null, DEVS=[], SRC=null, PDF=null, PAGES=0, DIRTY=false;

const SIZES = [
  ['9pt','小五'],['10pt',''],['10.5pt','五号'],['11pt',''],
  ['11.5pt',''],['12pt','小四'],['13pt',''],['14pt','四号']];
const MARGINS = ['8mm','10mm','12mm','14mm','16mm'];
// 行距对用户显示中文档位，em 只作内部值 —— 界面不出现英文单位
const LEADS = [['0.7em','紧凑'],['0.8em','较紧'],['0.85em','标准'],
               ['0.9em','较松'],['1.0em','宽松']];

const st = (msg,kind)=>{const e=$('#st');e.className='st show '+(kind||'');e.textContent=msg};

function fill(sel, list, cur){
  sel.innerHTML = list.map(x=>{
    const [v,label] = Array.isArray(x)?x:[x,''];
    const text = label ? `${v}（${label}）` : v;
    return `<option value="${v}" ${v===cur?'selected':''}>${text}</option>`;
  }).join('');
}

async function init(){
  const r = await (await fetch('/api/init')).json();
  DEVS = r.devices;
  $('#dev').innerHTML = DEVS.map((d,i)=>
    `<option value="${i}">${d.name}</option>`).join('');
  fill($('#cjk'),  r.fonts.cjk.length?r.fonts.cjk:['PingFang SC'],  r.config.fonts[1]);
  fill($('#latin'),r.fonts.latin.length?r.fonts.latin:['Helvetica Neue'], r.config.fonts[0]);
  fill($('#size'), SIZES, r.config.size);
  fill($('#margin'), MARGINS, r.config.margin);
  fill($('#leading'), LEADS, r.config.leading);
  $('#lang').value = r.config.lang;
  if(!r.has_poppler) st('预览需要 poppler：brew install poppler。不装仍可转换与保存。','info');
  pickDevice();
}

function pickDevice(){
  DEV = DEVS[+$('#dev').value];
  const [w,h] = DEV.display_mm;
  const badge = DEV.verified
    ? `<span class="badge v">已实测</span>`
    : `<span class="badge u">未实测</span>`;
  $('#devhint').innerHTML =
    `${badge} 显示区 <span class="v">${w} × ${h} mm</span> · ${DEV.ppi} ppi` +
    (DEV.verified ? '' : `<br>该尺寸为推算值，使用前建议先用校准页实测。`);
  update();
}

function cfg(){
  const [w,h] = DEV.display_mm;
  return {
    page_w: w+'mm', page_h: h+'mm',
    margin: $('#margin').value, size: $('#size').value,
    leading: $('#leading').value, lang: $('#lang').value,
    fonts: [$('#latin').value, $('#cjk').value]
  };
}

// 派生数值紧贴对应控件，作为辅助说明；技术参数降级到页脚
function update(){
  const c = cfg();
  const measure = parseFloat(c.page_w) - 2*parseFloat(c.margin);
  const sizeMm = parseFloat(c.size)*25.4/72;
  const cjk = Math.round(measure/sizeMm), lat = Math.round(measure/(sizeMm*0.5));
  const vc = cjk>45?['偏密','warn']:cjk>40?['偏长','warn']:cjk>=28?['合适','ok']:['偏短','warn'];
  const vl = lat>75?['偏长','warn']:lat>=45?['合适','ok']:['偏短','warn'];
  $('#sizehint').innerHTML =
    `中文 <span class="v">${cjk} 字/行</span> <span class="${vc[1]}">${vc[0]}</span> ／ ` +
    `西文 <span class="v">${lat} 字符/行</span> <span class="${vl[1]}">${vl[0]}</span>`;
  $('#marginhint').innerHTML = `版心宽度 <span class="v">${measure.toFixed(1)} mm</span>`;

  const t = [`页面 <b>${c.page_w} × ${c.page_h}</b>`,
             `版心 <b>${measure.toFixed(1)}mm</b>`,
             `字号 <b>${c.size}</b>（屏幕上的真实物理尺寸）`];
  if(PAGES) t.push(`共 <b>${PAGES}</b> 页`);
  if(window.__sizes) t.push(window.__sizes.length===1
      ? `页面尺寸 <b>全书统一</b>` : `<span class="warn">页面尺寸不一致：${window.__sizes.join(' / ')}</span>`);
  $('#tech').innerHTML = t.join('');

  if(PDF){ DIRTY = true; st('参数已修改，点「转换」后预览才会更新','info'); }
}
['#size','#margin','#leading','#cjk','#latin','#lang'].forEach(s=>$(s).onchange=update);
$('#dev').onchange = pickDevice;

// ── 载入 ──────────────────────────────────────────────
const drop=$('#drop');
drop.onclick=()=>$('#file').click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');take(e.dataTransfer.files[0])};
$('#file').onchange=e=>take(e.target.files[0]);

async function take(f){
  if(!f) return;
  st('正在载入 '+f.name+' …','run');
  const b = new Uint8Array(await f.arrayBuffer());
  let bin=''; for(let i=0;i<b.length;i+=8192) bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  const r = await (await fetch('/api/upload',{method:'POST',
    body:JSON.stringify({name:f.name,data:btoa(bin)})})).json();
  SRC=r.path; $('#fname').textContent=r.name; $('#go').disabled=false;
  st('已载入，可以转换','ok');
}

// ── 转换（与预览分开：转换产出 PDF，预览只是翻看它）────────
$('#go').onclick = async ()=>{
  if(!SRC) return;
  $('#go').disabled=true; st('转换中…一本书通常 1–3 秒','run');
  const r = await (await fetch('/api/convert',{method:'POST',
    body:JSON.stringify({path:SRC,config:cfg()})})).json();
  $('#go').disabled=false;
  if(!r.ok){ st('转换失败：'+r.error,'err'); return; }
  PDF=r.pdf; PAGES=r.metrics.pages; window.__sizes=r.metrics.page_sizes; DIRTY=false;
  $('#save').disabled=false;
  ['#pg','#prev','#next'].forEach(s=>$(s).disabled=false);
  $('#pg').max=PAGES; $('#pgtot').textContent=`/ ${PAGES} 页`;
  update(); st(`转换完成，共 ${PAGES} 页`,'ok');
  show(1);
};

// ── 预览（独立动作，不触发转换）──────────────────────
async function show(n){
  if(!PDF) return;
  n = Math.max(1, Math.min(PAGES||1, n));
  $('#pg').value=n;
  const r = await (await fetch('/api/preview',{method:'POST',
    body:JSON.stringify({pdf:PDF,page:n})})).json();
  if(!r.ok){ st('预览失败：'+r.error,'err'); return; }
  $('#page').innerHTML=`<img src="${r.url}&t=${Date.now()}" alt="第 ${n} 页">`;
  $('#pnote').textContent='等比预览 · 字号舒适度请以设备为准';
}
$('#pg').onchange=()=>show(+$('#pg').value);
$('#prev').onclick=()=>show((+$('#pg').value)-1);
$('#next').onclick=()=>show((+$('#pg').value)+1);

$('#save').onclick = async ()=>{
  const dest = prompt('另存为（完整路径）', (SRC||'').replace(/\.[^.]+$/,'')+'.pdf');
  if(!dest) return;
  const r = await (await fetch('/api/save',{method:'POST',
    body:JSON.stringify({pdf:PDF,dest})})).json();
  st(r.ok?'已保存到 '+r.saved:'保存失败：'+r.error, r.ok?'ok':'err');
};

init();
</script>
