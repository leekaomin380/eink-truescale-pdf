<!doctype html>
<meta charset="utf-8">
<title>print-to-quaderno · EPUB → Quaderno</title>
<style>
  :root{--bg:#faf9f7;--fg:#1a1a1a;--mut:#6b6b6b;--line:#ddd9d4;--acc:#2b6cb0;--ok:#2f7a3d;--bad:#b03030}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
  h1{font-size:15px;margin:0;font-weight:600}
  .sub{color:var(--mut);font-size:12px}
  main{display:grid;grid-template-columns:300px 1fr;gap:0;height:calc(100vh - 51px)}
  aside{padding:16px 18px;border-right:1px solid var(--line);overflow-y:auto}
  section{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column}
  .drop{border:1.5px dashed var(--line);border-radius:8px;padding:22px 14px;text-align:center;
        color:var(--mut);cursor:pointer;background:#fff;font-size:13px}
  .drop.on{border-color:var(--acc);background:#eef4fb;color:var(--acc)}
  .file{font-size:13px;margin-top:8px;word-break:break-all}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 4px}
  select,input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;
        background:#fff;font:inherit;font-size:13px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{width:100%;padding:9px;border:0;border-radius:6px;background:var(--acc);color:#fff;
        font:inherit;font-weight:500;cursor:pointer;margin-top:8px}
  button:disabled{opacity:.4;cursor:default}
  button.sec{background:#fff;color:var(--fg);border:1px solid var(--line)}
  .metrics{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;
        font-size:12px;margin-bottom:12px}
  .metrics b{font-weight:600}
  .m-row{display:flex;justify-content:space-between;padding:2px 0}
  .tag{font-size:11px;padding:1px 6px;border-radius:3px;background:#eee}
  .tag.good{background:#e3f2e5;color:var(--ok)} .tag.warn{background:#fdeaea;color:var(--bad)}
  .prevwrap{flex:1;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
        background:#f0eeea;border:1px solid var(--line);border-radius:6px;padding:16px}
  .page{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.12)}
  .page img{display:block;width:100%;height:auto}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--mut)}
  .bar input[type=number]{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font:inherit}
  .status{font-size:12px;padding:8px 10px;border-radius:5px;margin-top:10px;display:none}
  .status.show{display:block}
  .status.ok{background:#e3f2e5;color:var(--ok)} .status.err{background:#fdeaea;color:var(--bad)}
  .status.run{background:#fff5e0;color:#8a6100}
  .note{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.5}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
</style>

<header>
  <h1>EPUB → Quaderno</h1>
  <span class="sub" id="target">目标设备载入中…</span>
</header>

<main>
<aside>
  <div class="drop" id="drop">拖入 EPUB<br><span style="font-size:11px">或点击选择</span></div>
  <input type="file" id="file" accept=".epub,.fb2,.html,.md" hidden>
  <div class="file" id="fname"></div>

  <hr>

  <label>中文字体</label>
  <select id="cjk"></select>
  <label>西文字体</label>
  <select id="latin"></select>

  <div class="row">
    <div><label>字号</label><select id="size"></select></div>
    <div><label>语言</label>
      <select id="lang"><option value="zh">中文</option><option value="en">English</option></select>
    </div>
  </div>
  <div class="row">
    <div><label>边距</label><select id="margin"></select></div>
    <div><label>行距</label><select id="leading"></select></div>
  </div>

  <button id="go" disabled>转换并预览</button>
  <button id="send" class="sec" disabled>发送到设备</button>
  <button id="save" class="sec" disabled>另存 PDF…</button>

  <div class="status" id="st"></div>

  <div class="note" id="hint"></div>
</aside>

<section>
  <div class="metrics" id="metrics">
    <div class="m-row"><span>尚未转换</span></div>
  </div>
  <div class="bar">
    <span>预览第</span>
    <input type="number" id="pg" value="1" min="1">
    <span>页</span>
    <button class="sec" style="width:auto;padding:4px 12px;margin:0" id="pgo">显示</button>
    <span style="flex:1"></span>
    <span id="scaleinfo"></span>
  </div>
  <div class="prevwrap"><div class="page" id="page" style="width:340px">
    <div style="padding:40px 20px;text-align:center;color:#999;font-size:12px">
      转换后在此显示预览<br><span style="font-size:11px">按页面真实宽高比呈现</span>
    </div>
  </div></div>
</section>
</main>

<script>
const $ = s => document.querySelector(s);
let CFG = null, SRC = null, PDF = null;

const SIZES  = ['9pt','10pt','10.5pt','11pt','11.5pt','12pt','13pt','14pt'];
const MARGINS= ['8mm','10mm','12mm','14mm','16mm'];
const LEADS  = ['0.7em','0.8em','0.85em','0.9em','1.0em'];

function opts(sel, list, cur){
  sel.innerHTML = list.map(v=>`<option ${v===cur?'selected':''}>${v}</option>`).join('');
}
function status(msg, kind){
  const el=$('#st'); el.className='status show '+(kind||''); el.textContent=msg;
}

async function init(){
  const r = await (await fetch('/api/init')).json();
  CFG = r.config;
  $('#target').textContent =
    `目标：QUADERNO A5 · 页面 ${CFG.page_w} × ${CFG.page_h} · 1:1 无缩放`;
  opts($('#cjk'),  r.fonts.cjk.length?r.fonts.cjk:['PingFang SC'], CFG.fonts[1]||'PingFang SC');
  opts($('#latin'),r.fonts.latin.length?r.fonts.latin:['Helvetica Neue'], CFG.fonts[0]||'Helvetica Neue');
  opts($('#size'), SIZES, CFG.size);
  opts($('#margin'), MARGINS, CFG.margin);
  opts($('#leading'), LEADS, CFG.leading);
  $('#lang').value = CFG.lang;
  if(!r.has_poppler) $('#hint').textContent =
    '预览功能需要 poppler：brew install poppler。不装也能转换与发送。';
  liveMetrics();
}

function cfg(){
  return {
    page_w: CFG.page_w, page_h: CFG.page_h,
    margin: $('#margin').value, size: $('#size').value,
    leading: $('#leading').value, lang: $('#lang').value,
    fonts: [$('#latin').value, $('#cjk').value]
  };
}

// 数字读数：与预览缩放无关，因此不会因显示比例而误导
function liveMetrics(m){
  const c = cfg();
  const measure = parseFloat(c.page_w) - 2*parseFloat(c.margin);
  const sizeMm = parseFloat(c.size)*25.4/72;
  const cjk = Math.round(measure/sizeMm), lat = Math.round(measure/(sizeMm*0.5));
  const vt = v => v>75?['偏长','warn']:v>=45?['合适','good']:['偏短','warn'];
  const vc = v => v>45?['偏密','warn']:v>40?['偏长','warn']:v>=28?['合适','good']:['偏短','warn'];
  const [ct,cc]=vc(cjk), [lt,lc]=vt(lat);
  $('#metrics').innerHTML = `
    <div class="m-row"><span>版心宽度</span><b>${measure.toFixed(1)} mm</b></div>
    <div class="m-row"><span>中文行长</span><b>${cjk} 字/行 <span class="tag ${cc}">${ct}</span></b></div>
    <div class="m-row"><span>西文行长</span><b>${lat} 字符/行 <span class="tag ${lc}">${lt}</span></b></div>
    <div class="m-row"><span>正文字号</span><b>${c.size}（屏幕上的真实物理尺寸）</b></div>
    ${m&&m.pages?`<div class="m-row"><span>总页数</span><b>${m.pages} 页</b></div>`:''}
    ${m&&m.page_sizes?`<div class="m-row"><span>页面尺寸一致性</span><b>${
      m.size_uniform?'<span class="tag good">全书统一</span>'
                    :'<span class="tag warn">不一致！'+m.page_sizes.join(' / ')+'</span>'}</b></div>`:''}
  `;
}
['#size','#margin','#leading','#cjk','#latin','#lang'].forEach(s=>
  $(s).addEventListener('change', ()=>liveMetrics()));

// ── 文件载入 ────────────────────────────────────────────────
const drop=$('#drop');
drop.onclick=()=>$('#file').click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');take(e.dataTransfer.files[0])};
$('#file').onchange=e=>take(e.target.files[0]);

async function take(f){
  if(!f) return;
  status('正在载入 '+f.name+' …','run');
  const buf = await f.arrayBuffer();
  let bin=''; const b=new Uint8Array(buf);
  for(let i=0;i<b.length;i+=8192) bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  const r = await (await fetch('/api/upload',{method:'POST',
    body:JSON.stringify({name:f.name,data:btoa(bin)})})).json();
  SRC = r.path; $('#fname').textContent = r.name;
  $('#go').disabled=false; status('已载入，可以转换','ok');
}

// ── 转换 ────────────────────────────────────────────────────
$('#go').onclick = async ()=>{
  if(!SRC) return;
  $('#go').disabled=true; status('转换中，一本书通常 1–3 秒…','run');
  const r = await (await fetch('/api/convert',{method:'POST',
    body:JSON.stringify({path:SRC,config:cfg()})})).json();
  $('#go').disabled=false;
  if(!r.ok){ status('转换失败：'+r.error,'err'); return; }
  PDF = r.pdf; liveMetrics(r.metrics);
  $('#send').disabled=false; $('#save').disabled=false;
  status('转换完成，共 '+r.metrics.pages+' 页','ok');
  showPage(1);
};

async function showPage(n){
  if(!PDF) return;
  $('#pg').value=n;
  const r = await (await fetch('/api/preview',{method:'POST',
    body:JSON.stringify({pdf:PDF,page:n})})).json();
  if(!r.ok){ status('预览失败：'+r.error,'err'); return; }
  const ratio = parseFloat(CFG.page_h)/parseFloat(CFG.page_w);
  const w = 340;
  $('#page').style.width = w+'px';
  $('#page').innerHTML = `<img src="${r.url}&t=${Date.now()}" alt="预览">`;
  $('#scaleinfo').textContent =
    `等比预览 · 实际 ${CFG.page_w} × ${CFG.page_h}（字号舒适度请以设备为准）`;
}
$('#pgo').onclick=()=>showPage(parseInt($('#pg').value)||1);

$('#send').onclick = async ()=>{
  status('正在发送到设备…','run');
  const r = await (await fetch('/api/deliver',{method:'POST',
    body:JSON.stringify({pdf:PDF})})).json();
  status(r.ok?'已发送到设备（客户端需保持连接）':'发送失败：'+r.error, r.ok?'ok':'err');
};

$('#save').onclick = async ()=>{
  const dest = prompt('另存为（完整路径）', (SRC||'').replace(/\.[^.]+$/,'') + '.pdf');
  if(!dest) return;
  const r = await (await fetch('/api/save',{method:'POST',
    body:JSON.stringify({pdf:PDF,dest})})).json();
  status(r.ok?'已保存到 '+r.saved:'保存失败：'+r.error, r.ok?'ok':'err');
};

init();
</script>
